<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cozy K9 Shack – In-home pet grooming dedicated to providing a safe, stress-free grooming experience in a quiet, one-on-one environment. Serving Mount Holly, NC." />
    <title>Cozy K9 Shack | In-Home Pet Grooming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Hidden static form so Netlify can detect the "booking" form at build
      time. The real form lives in the React app (src/pages/Contact.jsx),
      which JS-renders after build and is invisible to Netlify's scanner.
      Field names here must match the React form exactly.
    -->
    <form name="booking" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="dogName" />
      <input type="text" name="dogBreed" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
