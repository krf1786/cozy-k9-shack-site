# Nginx config for cozyk9shack.com on the Hostinger VPS.
#
# Assumes Cloudflare stays in front as a proxy (orange-cloud DNS records)
# and SSL/TLS mode in the Cloudflare dashboard is set to "Full (strict)".
# That means:
#   - Visitors always get HTTPS from Cloudflare's edge (free, no renewal to
#     manage on your end).
#   - Cloudflare re-encrypts to this server, so this server also needs a
#     certificate — use a free Cloudflare "Origin Certificate"
#     (Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate),
#     valid up to 15 years, no Certbot/renewal cron needed. Save the two
#     values it gives you to the paths referenced below.
#
# Install: copy this file to /etc/nginx/sites-available/cozyk9shack.com,
# symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name cozyk9shack.com www.cozyk9shack.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cozyk9shack.com www.cozyk9shack.com;

    ssl_certificate     /etc/ssl/cloudflare/cozyk9shack.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cozyk9shack.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Restore the visitor's real IP (Cloudflare's IP ranges) instead of
    # logging Cloudflare's edge IP for every request.
    # Full current list: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
